[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hestia-os"
version = "0.1.0"
description = "Hestia OS - Cognitive Agent Operating System built on HMR"
requires-python = ">=3.11"

# 依赖以本表为唯一来源(CI 用 `pip install -e .` 安装,不再手写第二份清单)。
# 注意:HMR 与 HKC 以 vendor/ 内嵌随包分发、走 sys.path 加载,不是 PyPI 依赖,
# 故此处**不**声明 hmr/hkc —— 此前声明 hmr>=1.0.0 是空转项(永不从 PyPI 安装)。
dependencies = [
    # LLM 提供商(未装/未配 key 时模型路由降级 stub,其余功能照常)
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    # 语义嵌入与向量检索(Harness 语义漂移检测 + HKC 语义搜索)
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    # API 服务
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    # HTTP 客户端(渠道适配器 + Web 工具)。沿用既有 <0.28 约束
    "httpx>=0.24,<0.28",
    # 飞书加密事件解密
    "cryptography>=41.0.0",
    # 配置与终端输出
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.setuptools.packages.find]
# 只把主包 hestia 纳入安装;vendor/、tests/、frontend/ 等以仓库相对路径使用,不入包。
include = ["hestia*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "ruff>=0.16", "mypy>=1.10", "coverage>=7.5"]
# 浏览器子系统(HIR-Browser)。playwright 是重可选依赖:装了才启用真实浏览器,
# 未装则 /api/browser/* 优雅降级(available=False)。装后还需 `playwright install chromium`。
browser = ["playwright>=1.44.0"]
# 知识核心(HKC,vendor/hkc)。核心运行时依赖;缺失时 /api/knowledge/* 优雅降级。
# 真实语义向量另需 sentence-transformers+faiss(已随本体);文件摄入见 knowledge-files。
knowledge = ["networkx>=3.0", "rank-bm25>=0.2", "aiofiles>=23.0", "requests>=2.31"]
# HKC 文件摄入(PDF/epub/mobi/docx/xlsx)。仅当要摄入电子书/PDF/Office 文档时需要。
knowledge-files = ["pymupdf>=1.24", "ebooklib>=0.18", "beautifulsoup4>=4.12", "mobi>=0.3.3", "python-multipart>=0.0.9", "python-docx>=1.1", "openpyxl>=3.1"]


# ─────────────────────────────────────────────────────────────
# 工程化工具链(S1):ruff / mypy / pytest / coverage
# 策略:首次引入,存量告警显式豁免(只保留死代码/真 bug 硬门),S3 拆分后逐步收紧。
# ─────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py311"
# 只 lint 主包 + 测试;vendor/ 是内嵌第三方,frontend/skills/tools/bench/evals/examples 非 Python 主包。
extend-exclude = ["vendor/", "frontend/", "skills/", "tools/", "bench/", "evals/", "examples/"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
# 存量告警显式豁免(风格/现代化类);F 系列(pyflakes 死代码/未定义名)已清零并作为硬门。
# S3 拆分大文件后,逐条从 ignore 移除以收紧。
ignore = [
    "E501",                                              # line-too-long(862 存量)
    "E701", "E702", "E731", "E741", "E401", "E402",      # pycodestyle 风格
    "I001",                                              # import 排序(138 存量)
    "B008", "B034", "B904", "B905",                      # bugbear 非致命(33 存量)
    "UP006", "UP015", "UP017", "UP031", "UP035", "UP037", "UP041", "UP042", "UP045",  # pyupgrade(143 存量)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# 渐进式:首次引入,存量 425 个类型错误不在 S1 范围,CI 用 warning 级不阻塞。

[tool.pytest.ini_options]
testpaths = ["tests"]
# S2 迁移进度(白名单):已迁移为 pytest 的文件。7 个原有 pytest 风格 + 27 个类 b(有 test_ 函数、无顶层副作用)
#  + 16 个类 c(check+main,已加 test_* 薄包装)。
# 剩余未迁移:26 个类 a(纯顶层脚本,import 即执行副作用,需消除 import 副作用)。
# 若沿用默认 test_*.py,会把未迁移脚本式测试的顶层副作用当收集过程执行 → 收集错误 + 数分钟耗时。
python_files = [
    "test_agent_lifecycle.py",
    "test_ahs_p2.py",
    "test_anthropic_tools.py",
    "test_api_auth.py",
    "test_audit_sink.py",
    "test_browser.py",
    "test_capabilities.py",
    "test_channels.py",
    "test_compaction_toolpair.py",
    "test_dispatch.py",
    "test_domain_reasoners.py",
    "test_e2e.py",
    "test_embedding_singleton.py",
    "test_evals_smoke.py",
    "test_event_spine.py",
    "test_finance.py",
    "test_governance.py",
    "test_governance_audit.py",
    "test_governance_middleware.py",
    "test_hkc.py",
    "test_injection_guard.py",
    "test_integration.py",
    "test_itinerary.py",
    "test_kernel.py",
    "test_learning.py",
    "test_llm_planner.py",
    "test_memory_recall.py",
    "test_orchestration.py",
    "test_orchestration_decoupled.py",
    "test_p3_p5_hardening.py",
    "test_parallel_dispatch.py",
    "test_pipeline.py",
    "test_planner.py",
    "test_policy_gate.py",
    "test_reasoner.py",
    "test_scheduler.py",
    "test_search.py",
    "test_sessions.py",
    "test_shadow_learning.py",
    "test_shared_write.py",
    "test_skills.py",
    "test_stats_and_events.py",
    "test_supervisor_pipeline.py",
    "test_supervisor_triage.py",
    "test_taint.py",
    "test_tool_params.py",
    "test_tool_use.py",
    "test_toplevel_concurrency.py",
    "test_truth_crystallizer.py",
    "test_truth_flow.py",
]
addopts = "-q"

[tool.coverage.run]
source = ["hestia"]

[tool.coverage.report]
show_missing = true
