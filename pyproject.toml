addopts = "-q"

[tool.coverage.run]
source = ["foxclaw"]
# 全量回归走 run_all.py(每文件独立子进程),coverage 需 parallel 模式:每个子进程各写一份
# .coverage,最后 `coverage combine` 合并成基线。patch=["subprocess"] 让 coverage run 设置
# COVERAGE_PROCESS_CONFIG 环境变量,子进程经 coverage 的 sitecustomize(.pth)自动测量,
# 无需逐个子进程手动包 coverage run(run_all.py 的 subprocess 用 dict(os.environ,...) 继承,链路完整)。
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
