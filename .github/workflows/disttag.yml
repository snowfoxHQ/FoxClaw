# 临时 workflow:把 foxclaw 的 latest dist-tag 修正到 0.1.9(0.1.9 的发布
# 因 npm staged-commit 异步管线丢了一次 dist-tag 更新)。用完即删,不留仓库。
name: disttag-fix
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Set latest dist-tag to 0.1.9
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add foxclaw@0.1.9 latest
