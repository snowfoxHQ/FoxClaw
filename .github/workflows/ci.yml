name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip + HF models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: hestia-deps-${{ runner.os }}-py312-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 显式依赖清单(与 README 一致)。不 pip install -e . —— HMR 是 vendor 内嵌,
          # 走 sys.path 加载,无需从 PyPI 装同名包。
          pip install fastapi uvicorn "httpx<0.28" openai cryptography websockets \
            pyyaml numpy scikit-learn rich pydantic python-dotenv sentence-transformers

      - name: Warm embedding cache
        # 先联网下好默认 embedding,run_all 会以 HF_HUB_OFFLINE 离线读取(与本地一致)。
        # 下载失败也不致命:Harness 会自动降级 n-gram 哈希嵌入,回归仍绿。
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')" || true

      - name: Full regression
        # run_all.py 内部注入 HF_HUB_OFFLINE / 强制 stub LLM / UTF-8,故 CI 无需 LLM key、
        # 不联网调模型,确定性绿。
        run: python tests/run_all.py
