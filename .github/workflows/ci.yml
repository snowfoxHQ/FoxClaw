name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# 合并自占位包仓库的 ci.yml：只取权限最小化与手动触发两项，
# 其余（3.10/3.13/3.14 矩阵、ruff format 硬门）未并入——
# 本项目 requires-python>=3.11，且存量 240 个文件未过 ruff format，
# 直接加会当场红。格式门待单独一轮 format 后再开。
permissions:
  contents: read

jobs:
  toolchain:
    # S1:工程化安全网 —— ruff(硬门) + mypy(棘轮) + 体积(棘轮) + pytest 收集。
    # ruff 只保留 F 系列死代码/真 bug 作为硬门,存量风格告警已在 pyproject 显式豁免;
    # 覆盖 foxclaw/ 与 tests/(tests 于 2026-11 纳入:此前 13 条 F 系列全藏在这里)。
    # mypy 自 2026-11 起改为棘轮门(tools/mypy_ratchet.py):存量 673 冻结,只许降不许升。
    #   此前是 continue-on-error,数字从注释里的 425 一路涨到 673 也无人发现 ——
    #   不阻塞的检查等于没有检查。
    # 体积门(tools/size_check.py):单文件 <=15KB;现有 25 个超限文件冻结在白名单,
    #   新增超限直接失败,拆小了会提示移出白名单。
    # pytest 只做快速收集检查(S2 已把全部 76 个测试迁为 pytest,无顶层副作用),
    # 真正的断言执行统一走下方 regression job 的 run_all.py(每文件独立子进程隔离单例)。
    strategy:
      fail-fast: false
      matrix:
        # 3.12 是发布/回归基线;3.14 覆盖「本地装了新版、CI 从未验证」的版本漂移。
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolchain (pinned, py3.12)
        if: matrix.python-version == '3.12'
        # 基线版本按 requirements.txt 装:那是 uv 从 pyproject 解析出的完整闭包,
        # 与本机 .venv 一致。dev extra 随后补装,pip 不会改写已满足的 pin。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Install toolchain (latest, py3.14)
        if: matrix.python-version == '3.14'
        # 3.14 腿刻意不读 requirements.txt:它的职责是发现「依赖在新解释器上解析/安装失败」,
        # 跟着 pin 会把这个信号一起锁死。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (hard gate)
        # tests/ 一并纳入:未用 import / 未定义名在测试里同样是死代码信号。
        # 此前 tests/ 完全没有门禁,存量 13 条 F 系列(含 1 条 F811 重复 import)藏在
        # 测试文件里无人发现 —— 只查 foxclaw/ 等于给测试留了盲区。
        run: |
          ruff check foxclaw/
          ruff check tests/

      - name: Mypy ratchet (no new type errors)
        # 只在基线版本跑:基线数字按 3.12 校准,两版本并行会因 typeshed 差异抖动。
        if: matrix.python-version == '3.12'
        run: python tools/mypy_ratchet.py

      - name: File size ratchet (<=15KB)
        run: python tools/size_check.py

      - name: Pytest collect check (all tests migrated)
        run: python -m pytest --collect-only -q

      - name: Release preflight (version sources)
        # 版本号漏改一处会让发布物自相对不上,而发出去不能覆盖。这里只查"四处是否一致",
        # 产物结构检查(需先 build)在 .github/workflows/release.yml 里。
        if: matrix.python-version == '3.12'
        run: python tools/release_check.py

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip + HF models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: foxclaw-deps-${{ runner.os }}-py312-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 单源:pyproject.toml 声明依赖,requirements.txt 是它解析出的锁定闭包(uv 生成)。
          # 先装锁再装本体,回归跑的就是本机 .venv 同一套版本,而不是当天 PyPI 的最新版。
          # HMR/HKC 是 vendor 内嵌、走 sys.path 加载,不是 PyPI 依赖(已在 pyproject 注明)。
          # dev extra 提供 pytest + openpyxl/python-docx(默认回归 test_file_ingest/test_domain_import 硬依赖)。
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Warm embedding cache
        # 先联网下好默认 embedding,run_all 会以 HF_HUB_OFFLINE 离线读取(与本地一致)。
        #
        # 【纠正】原注释写「下载失败也不致命:Harness 会自动降级 n-gram 哈希嵌入,
        # 回归仍绿」—— **这句是错的**,且很可能让 M2 缺陷长期潜伏。
        # 实测(2026-10-05):哈希嵌入对中文几乎无区分度(同域相似度 -0.17、
        # 跨域 +0.00,差异 <0.17)→ 语义漂移分恒为 1.0 → 所有正常请求一律 BLOCK,
        # 6 项治理测试全红。降级**不是**安全兜底。
        #
        # 现在:预热失败即让 CI 失败(去掉 `|| true`),因为它直接决定治理能力可用性,
        # 不该被静默吞掉。M2 修复后降级方向已改为 fail-open(停用语义维度、
        # 保留 tool/scope 确定性判定),回归可绿,但**拦截能力是降级的**,
        # 不可把降级当作正常路径。
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Full regression (with coverage)
        # run_all.py 内部注入 HF_HUB_OFFLINE / 强制 stub LLM / UTF-8,故 CI 无需 LLM key、
        # 不联网调模型,确定性绿。coverage 用 parallel 模式测所有子进程,最后 combine 出基线数字。
        run: |
          coverage run tests/run_all.py
          coverage combine
          coverage report
          coverage xml

  audit:
    # 依赖漏洞门。此前 SCA 只覆盖 Dockerfile 与前端 package.json,Python 侧完全空白 ——
    # 实测全局环境 34 个包挂着 278 条已知漏洞(pyjwt 15、starlette 14、filelock 9…),
    # 而同一份 pyproject 干净解析出来是 0 条,说明问题在"从不升级的运行环境"而非依赖声明。
    #
    # 审计 requirements.txt 而非运行环境:它是「实际会被装出来的东西」,结果可复现,
    # 且不依赖扫描机的环境状态。此门红了怎么修:
    #   1) 升级 pyproject 里对应依赖的下限/上限;
    #   2) uv pip compile pyproject.toml --universal -o requirements.txt 重新生成并提交
    #      (--universal 必须带:否则 Windows 专属包会写成无条件依赖,本作业在 Linux 上装不动);
    #   3) 确无可用修复版本时,在下面 --ignore-vuln 逐条登记 ID + 原因,不要整门关掉。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7"

      - name: Audit pinned runtime dependencies
        # --no-deps:requirements.txt 已是 uv 解析好的完整闭包(含全部传递依赖),
        # 不需要 pip-audit 再解析一遍 —— 不加会静默跑几分钟且可能超时。
        run: pip-audit -r requirements.txt --no-deps --progress-spinner off
